<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Student Study Planner</h1>
        <p>Organize your university studies and stay focused.</p>
    </header>

    <main>

        <section class="planner">
            <h2>Add a Study Task</h2>

            <input type="text" id="taskInput" placeholder="Enter a study task">

            <select id="subjectInput">
                <option value="">Choose a subject</option>
                <option value="Database">Database</option>
                <option value="Networking">Networking</option>
                <option value="Programming">Programming</option>
                <option value="Web Development">Web Development</option>
                <option value="Information Systems">Information Systems</option>
            </select>

            <button onclick="addTask()">Add Task</button>
        </section>

        <section>
            <h2>My Study Tasks</h2>
            <div id="taskList"></div>
        </section>

    </main>

    <footer>
        <p>Made by Melissa | IT Student 💻</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
